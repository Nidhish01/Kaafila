name: Kaafila driver checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            driver-mobile/package-lock.json
            firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: npm ci && npm run typecheck
        working-directory: driver-mobile
      - run: npx expo export --platform android --output-dir dist
        working-directory: driver-mobile
      - run: npm ci && npm run build
        working-directory: firebase/functions
      - run: npm run test:firebase
